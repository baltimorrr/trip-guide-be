spring:
  application:
    name: spring-base
  profiles:
    # Local development (application-local.yml) unless a profile is set: prod via
    # SPRING_PROFILES_ACTIVE, test via @ActiveProfiles.
    default: local
  data:
    web:
      pageable:
        # Clients asking for more get this many per page.
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Override with SERVER_PORT in .env when 8080 is taken.
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Required. Left empty when APP_JWT_SECRET is unset, which fails @NotBlank validation at
    # startup with a report naming this property. Generate: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:}
    issuer: spring-base
    # Short on purpose: the refresh token (app.auth) keeps the user signed in.
    access-token-ttl: 15m
  auth:
    # Emailed links open pages of this web app, which post the token to the API.
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    # How long a sign-in (refresh-token session) lasts, without and with "remember me". Refreshing never extends it.
    refresh-token-ttl: 1d
    remember-me-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    # Minimum time between two verification or reset emails to one account.
    email-cooldown: 1m
    lockout:
      # This many failed sign-ins within the window (counted from the first failure) lock the account.
      max-attempts: 5
      window: 15m
      duration: 15m
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  search:
    max-nights: 30
    max-days-ahead: 365
    max-rooms: 8
    max-adults: 30
    max-children: 10
    # Hotels with fewer user reviews come after the others when results are sorted by rating.
    rating-sort-min-reviews: 10
  destinations:
    sync:
      # Rebuilds destinations from listed hotels' addresses. Spring cron (six fields); "-" disables it.
      cron: ${APP_DESTINATIONS_SYNC_CRON:0 */10 * * * *}
      on-startup: ${APP_DESTINATIONS_SYNC_ON_STARTUP:true}
