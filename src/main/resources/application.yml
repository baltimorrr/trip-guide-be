spring:
  application:
    name: spring-base
  profiles:
    # Local development (application-local.yml) unless a profile is set: prod via
    # SPRING_PROFILES_ACTIVE, test via @ActiveProfiles.
    default: local
  data:
    web:
      pageable:
        # Clients asking for more get this many per page.
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mappings match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Override with SERVER_PORT in .env when 8080 is taken.
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    # Request forms open ready to send: the examples (OpenApiExamples, @Schema on the DTOs) match the demo seed.
    try-it-out-enabled: true
    # Keeps the token pasted into Authorize across page reloads.
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Required. Left empty when APP_JWT_SECRET is unset, which fails @NotBlank validation at
    # startup with a report naming this property. Generate: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:}
    issuer: spring-base
    # Short on purpose: the refresh token (app.auth) keeps the user signed in.
    access-token-ttl: 15m
  auth:
    # Emailed links open pages of this web app, which post the token to the API.
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    # How long a sign-in (refresh-token session) lasts, without and with "remember me". Refreshing never extends it.
    refresh-token-ttl: 1d
    remember-me-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    # Minimum time between two verification or reset emails to one account.
    email-cooldown: 1m
    lockout:
      # This many failed sign-ins within the window (counted from the first failure) lock the account.
      max-attempts: 5
      window: 15m
      duration: 15m
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    # Every request is limited per client IP (an IPv6 client by its /64). Behind a reverse proxy set
    # server.forward-headers-strategy, or all clients share the proxy's limits.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # Comma-separated addresses that are never limited, e.g. an internal monitor. Empty = none.
    exempt-addresses: ${APP_RATE_LIMIT_EXEMPT_ADDRESSES:}
    # Most clients remembered per limit; past that the least recently seen are forgotten.
    max-tracked-clients: 50000
    limits:
      # capacity requests per period, refilled gradually. A request under a specific limit also spends one of general.
      general:
        capacity: 300
        period: 1m
      login:
        capacity: 10
        period: 1m
      register:
        capacity: 10
        period: 1h
      # verify-email/resend and password/forgot share this one.
      email:
        capacity: 10
        period: 1h
      # search/hotels, search/hotels/filters, hotels/{slug}/rooms and the cart (GET, add, edit, merge) share this one.
      search:
        capacity: 60
        period: 1m
      # bookings/quote, bookings (checkout: priced like search; codes are checked there) and bookings/{reference}/payment
      # (calls Stripe) share this one.
      checkout:
        capacity: 20
        period: 1m
  search:
    max-nights: 30
    max-days-ahead: 365
    max-rooms: 8
    max-adults: 30
    max-children: 10
    # Hotels with fewer user reviews come after the others when results are sorted by rating.
    rating-sort-min-reviews: 10
  destinations:
    sync:
      # Rebuilds destinations from listed hotels' addresses. Spring cron (six fields); "-" disables it.
      cron: ${APP_DESTINATIONS_SYNC_CRON:0 */10 * * * *}
      on-startup: ${APP_DESTINATIONS_SYNC_ON_STARTUP:true}
  cart:
    # Most lines (rate + stay + guests) in one cart; each read prices every line's stay.
    max-items: 20
    # Deletes cart lines whose check-in has passed. Spring cron (six fields); "-" disables it.
    expiry-cron: ${APP_CART_EXPIRY_CRON:0 0 * * * *}
  booking:
    # How long a new Pending booking holds its rooms while the customer pays.
    hold: 15m
    # Expires Pending bookings whose hold has passed and releases their rooms. Spring cron (six fields); "-" disables it.
    expiry-cron: ${APP_BOOKING_EXPIRY_CRON:0 * * * * *}
  stripe:
    # Optional: without the secret key the payment endpoints answer 503, without the webhook secret the webhook does.
    # Test-mode keys are in the Stripe Dashboard (Developers > API keys); `stripe listen` prints a local webhook secret.
    secret-key: ${APP_STRIPE_SECRET_KEY:}
    webhook-secret: ${APP_STRIPE_WEBHOOK_SECRET:}
  payment:
    # Resends refunds that didn't reach Stripe after their cancellation. Spring cron (six fields); "-" disables it.
    refund-retry-cron: ${APP_REFUND_RETRY_CRON:30 * * * * *}
