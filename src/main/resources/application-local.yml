# Local development: the default profile when none is set. Not active under prod or test.
spring:
  config:
    # Local secrets live in a gitignored .env file at the project root.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # Leave the database running between app restarts.
      lifecycle-management: start-only
  flyway:
    # db/seed holds demo hotels and featured destinations for local development only.
    locations: classpath:db/migration,classpath:db/seed
