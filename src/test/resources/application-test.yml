# Test-only configuration, activated by @IntegrationTest via @ActiveProfiles("test").
# The datasource comes from TestcontainersConfiguration (@ServiceConnection), so none is set here.

app:
  jwt:
    # TEST ONLY. Real secrets come from APP_JWT_SECRET and are never committed.
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtbmV2ZXItdXNlLWl0LWFueXdoZXJlLWVsc2U=
    issuer: spring-base
    access-token-ttl: 15m
  bootstrap:
    admin:
      email: admin@test.local
      password: admin-test-password-123
  auth:
    # Tests ask for several links in a row for one account.
    email-cooldown: 0s
  cors:
    allowed-origins: ""
  rate-limit:
    # MockMvc's address. Other tests sign in and search far more than the limits allow; rate limit tests send from
    # their own addresses instead.
    exempt-addresses: 127.0.0.1
  destinations:
    sync:
      # Tests call DestinationSyncService.sync() themselves; a background run would race with them.
      cron: "-"
      on-startup: false
  cart:
    # Tests call CartService.removeExpiredItems() themselves.
    expiry-cron: "-"
  booking:
    # Tests call BookingService.expireHolds() themselves.
    expiry-cron: "-"
  payment:
    # Tests call RefundService.retryUnsent() themselves.
    refund-retry-cron: "-"
  stripe:
    # TEST ONLY. Stripe is never called in tests (FakePaymentGateway replaces the gateway); webhook tests sign their
    # requests with this secret.
    secret-key: sk_test_only_never_sent_to_stripe
    webhook-secret: whsec_test_only_c2lnbmluZy1zZWNyZXQtZm9yLXRlc3Rz
